name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PanBridge/PanBridge.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version do not match.' }
          "PANBRIDGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build the immutable release tag
        shell: pwsh
        run: |
          $tag = "v$env:PANBRIDGE_VERSION"
          # A tag-triggered checkout may already have a local tag with this
          # name. Force-refresh it so both tag and workflow-dispatch runs use
          # the immutable remote tag consistently.
          git fetch --force --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw 'The version tag must be pushed before publishing.' }
          git checkout --detach $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the release source.' }
      - name: Prepare verified build dependencies
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          .\scripts\bootstrap.ps1 -Installer
      - name: Reuse Go build cache
        uses: actions/cache@v4
        with:
          path: |
            .build-tools/go-cache
            .build-tools/go-build-cache
            .build-tools/rclone-lite
          key: windows-rclone-${{ hashFiles('dependencies.json', 'src/rclone/**', 'scripts/build-rclone.ps1') }}
      - name: Build portable package and EXE installer
        shell: pwsh
        run: .\scripts\build.ps1 -Installer -SkipBootstrap
      - name: Test installed application
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'PanBridge-install-test'
          $setup = (Resolve-Path "dist/PanBridge-$env:PANBRIDGE_VERSION-Setup-x64.exe").Path
          .\scripts\test-installer.ps1 -Setup $setup -Destination $destination
          $info = Get-Content (Join-Path $destination 'package-info.json') -Raw | ConvertFrom-Json
          $info | ConvertTo-Json -Depth 5 | Set-Content dist/package-info.json
      - name: Preserve size and test reports
        uses: actions/upload-artifact@v4
        with:
          name: package-verification
          path: |
            dist/package-info.json
            ${{ runner.temp }}/PanBridge-install-test/package-test.json
            ${{ runner.temp }}/PanBridge-install-test/installer-test.json
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @("dist/PanBridge-$env:PANBRIDGE_VERSION-Setup-x64.exe", "dist/PanBridge-$env:PANBRIDGE_VERSION-win-x64.zip")
          $lines = $files | ForEach-Object { $hash = Get-FileHash $_ -Algorithm SHA256; "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($_))" }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:PANBRIDGE_VERSION"
          $assets = @("dist/PanBridge-$env:PANBRIDGE_VERSION-Setup-x64.exe", "dist/PanBridge-$env:PANBRIDGE_VERSION-win-x64.zip", 'dist/SHA256SUMS.txt', 'dist/package-info.json')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --verify-tag --title "PanBridge $env:PANBRIDGE_VERSION" --notes-file "docs/releases/$tag.md" --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
